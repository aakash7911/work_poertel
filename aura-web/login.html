<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Aura</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f9f0e4;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%; max-width: 400px; height: 100%;
            display: flex; flex-direction: column; position: relative;
            background-color: #f9f0e4; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header-graphic {
            background-color: #E47254; height: 250px; position: relative;
            display: flex; justify-content: center;
            border-bottom-left-radius: 32px; border-bottom-right-radius: 32px;
        }
        .shape-yellow {
            position: absolute; width: 160px; height: 160px; border-radius: 50%;
            background-color: #C5B361; left: -40px; top: 60px;
        }
        .shape-teal {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            background-color: #73C292; right: -60px; bottom: -80px;
        }
        .header-title {
            color: white; font-size: 28px; font-weight: 800; margin-top: 50px;
            z-index: 2; text-align: center;
        }

        .card {
            background-color: white; border-radius: 32px; margin: -60px 20px 20px 20px;
            padding: 32px 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); z-index: 10;
        }

        .input {
            width: 100%; background-color: #F5F5F5; border-radius: 16px;
            padding: 16px; border: none; font-size: 15px; box-sizing: border-box;
            margin-bottom: 12px; outline: none;
        }

        .action-btn {
            background-color: #000; color: #fff; border-radius: 100px;
            padding: 16px; width: 100%; border: none; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-bottom: 16px;
        }

        .link-text {
            text-align: center; font-size: 14px; color: #666; margin-bottom: 12px; cursor: pointer;
        }
        .link-text span { color: #007AFF; font-weight: bold; }

        .policy-container {
            display: flex; align-items: flex-start; gap: 8px; margin-bottom: 16px; font-size: 12px; color: #666; line-height: 1.4;
        }
        .policy-container input[type="checkbox"] {
            margin-top: 2px; cursor: pointer;
        }
        .policy-container a {
            color: #007AFF; text-decoration: none; font-weight: 500;
        }

        .action-btn:disabled {
            background-color: #ccc; cursor: not-allowed;
        }
        .action-btn.active {
            background-color: #73C292; /* Green */
        }

        .auth-view { display: none; }
        .auth-view.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Graphic -->
        <div class="header-graphic">
            <div class="shape-yellow"></div>
            <div class="shape-teal"></div>
            <h1 class="header-title" id="pageTitle">Welcome</h1>
        </div>

        <div class="card">
            
            <!-- LOGIN VIEW -->
            <div id="view-login" class="auth-view active">
                <input type="email" id="l-email" class="input" placeholder="Email">
                <input type="password" id="l-password" class="input" placeholder="Password">
                
                <div class="policy-container">
                    <input type="checkbox" id="l-policy" onchange="toggleBtn('l-policy', 'btn-login')">
                    <label for="l-policy">I have read and agree to the <a href="https://aakash7911.github.io/license2/" target="_blank">Privacy Policy & Legal License</a></label>
                </div>

                <button id="btn-login" class="action-btn" onclick="login()" disabled>Log In</button>
                <div class="link-text" onclick="switchView('forgot')">Forgot Password?</div>
                <div class="link-text" onclick="switchView('register')">Don't have an account? <span>Create one</span></div>
            </div>

            <!-- REGISTER VIEW -->
            <div id="view-register" class="auth-view">
                <input type="text" id="r-name" class="input" placeholder="Full Name">
                <input type="email" id="r-email" class="input" placeholder="Email">
                <input type="password" id="r-password" class="input" placeholder="Password">
                
                <div class="policy-container">
                    <input type="checkbox" id="r-policy" onchange="toggleBtn('r-policy', 'btn-register')">
                    <label for="r-policy">I have read and agree to the <a href="https://aakash7911.github.io/license2/" target="_blank">Privacy Policy & Legal License</a></label>
                </div>

                <button id="btn-register" class="action-btn" onclick="register()" disabled>Create Account</button>
                <div class="link-text" onclick="switchView('login')">Already have an account? <span>Log In</span></div>
            </div>

            <!-- OTP VERIFY VIEW (Registration) -->
            <div id="view-otp" class="auth-view">
                <p style="text-align:center; color:#666;">Enter the OTP sent to your email</p>
                <input type="text" id="o-code" class="input" placeholder="6-digit OTP">
                <button class="action-btn" onclick="verifyOTP()">Verify & Create Account</button>
            </div>

            <!-- FORGOT PASSWORD VIEW -->
            <div id="view-forgot" class="auth-view">
                <p style="text-align:center; color:#666;">Enter your email to receive an OTP</p>
                <input type="email" id="f-email" class="input" placeholder="Email">
                <button class="action-btn" onclick="forgotPassword()">Send OTP</button>
                <div class="link-text" onclick="switchView('login')">Back to <span>Log In</span></div>
            </div>

            <!-- RESET PASSWORD VIEW -->
            <div id="view-reset" class="auth-view">
                <p style="text-align:center; color:#666;">Enter OTP and new password</p>
                <input type="text" id="reset-otp" class="input" placeholder="6-digit OTP">
                <input type="password" id="reset-password" class="input" placeholder="New Password">
                <button class="action-btn" onclick="resetPassword()">Reset Password</button>
            </div>

        </div>
    </div>

    <script>
        const API = '/v1/auth';
        let currentEmail = '';

        function toggleBtn(checkboxId, btnId) {
            const cb = document.getElementById(checkboxId);
            const btn = document.getElementById(btnId);
            if(cb.checked) {
                btn.disabled = false;
                btn.classList.add('active');
            } else {
                btn.disabled = true;
                btn.classList.remove('active');
            }
        }

        function setLoader(btnId, isLoading, defaultText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = defaultText;
            }
        }

        function switchView(view) {
            document.querySelectorAll('.auth-view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            
            const titleMap = {
                'login': 'Welcome<br>Back',
                'register': 'Create an<br>account',
                'otp': 'Verify<br>Email',
                'forgot': 'Reset<br>Password',
                'reset': 'New<br>Password'
            };
            document.getElementById('pageTitle').innerHTML = titleMap[view] || 'Aura';
        }

        async function login() {
            try {
                const email = document.getElementById('l-email').value;
                const password = document.getElementById('l-password').value;
                if(!email || !password) return alert("Email & Password required");
                
                setLoader('btn-login', true, 'Log In');
                
                const res = await fetch(`${API}/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                setLoader('btn-login', false, 'Log In');
                
                if(data.success) {
                    localStorage.setItem('userEmail', email); // Save email for profile fetches
                    localStorage.setItem('userRole', data.role); // Save role for auto-redirects
                    if(data.role === 'admin') {
                        window.location.replace('/admin-dashboard.html');
                    } else if(data.role === 'company') {
                        localStorage.setItem('companyName', data.companyName);
                        localStorage.setItem('adocId', data.adocId);
                        window.location.replace('/company-dashboard.html');
                    } else {
                        window.location.replace('/dashboard.html');
                    }
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error(error);
                setLoader('btn-login', false, 'Log In');
                alert('Server se connect nahi ho paya! Agar aap ye GitHub Pages par chala rahe hain, toh login kaam nahi karega kyunki wahan backend nahi hota. Kripya app ko Render.com par deploy karein.');
            }
        }

        async function register() {
            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value;
            const password = document.getElementById('r-password').value;
            if(!name || !email || !password) return alert("All fields required");

            setLoader('btn-register', true, 'Create Account');

            const res = await fetch(`${API}/register`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            
            setLoader('btn-register', false, 'Create Account');
            
            if(data.success) {
                currentEmail = email;
                alert('OTP sent to your email (check server console if no real email set).');
                switchView('otp');
            } else {
                alert(data.message);
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('o-code').value;
            const res = await fetch(`${API}/verify-otp`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email: currentEmail, otp })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) switchView('login');
        }

        async function forgotPassword() {
            currentEmail = document.getElementById('f-email').value;
            const res = await fetch(`${API}/forgot-password`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email: currentEmail })
            });
            const data = await res.json();
            if(data.success) {
                alert('OTP sent to your email (check console).');
                switchView('reset');
            } else {
                alert(data.message);
            }
        }

        async function resetPassword() {
            const otp = document.getElementById('reset-otp').value;
            const newPassword = document.getElementById('reset-password').value;
            const res = await fetch(`${API}/reset-password`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email: currentEmail, otp, newPassword })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) switchView('login');
        }

        // Init: Auto-redirect if already logged in
        const savedEmail = localStorage.getItem('userEmail');
        const savedRole = localStorage.getItem('userRole');
        
        if (savedEmail && savedRole) {
            if (savedRole === 'admin') window.location.replace('/admin-dashboard.html');
            else if (savedRole === 'company') window.location.replace('/company-dashboard.html');
            else window.location.replace('/dashboard.html');
        } else {
            switchView('login');
        }
    </script>
</body>
</html>
