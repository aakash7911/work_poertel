<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Aura</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background-color: #f9f0e4; height: 100vh; display: flex; justify-content: center;
        }
        .app-container {
            width: 100%; max-width: 400px; height: 100vh; background-color: #f9f0e4;
            display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #000; color: #fff; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h2 { margin: 0; font-size: 20px; }
        .logout-btn { background: #E47254; border: none; padding: 6px 12px; color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .content { padding: 20px; overflow-y: auto; flex: 1; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
        .admin-card {
            background: #fff; border: 2px solid #000; border-radius: 16px; padding: 20px;
            text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0 #000; transition: transform 0.1s;
        }
        .admin-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        .admin-card i { font-size: 32px; margin-bottom: 10px; color: #E47254; }
        .admin-card span { font-weight: bold; font-size: 14px; }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff; width: 90%; max-width: 350px; padding: 24px; border-radius: 16px; border: 2px solid #000;
        }
        .modal h3 { margin-top: 0; }
        .input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; }
        textarea.input { height: 80px; resize: none; }
        .btn-row { display: flex; justify-content: space-between; margin-top: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #ccc; color: #000; }
        .btn-submit { background: #000; color: #fff; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>Admin Panel</h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="content">
            <p style="color: #666; margin-top: 0;">Welcome, Admin! Select an action below:</p>

            <div class="grid">
                <!-- Button 1: Post Job -->
                <div class="admin-card" onclick="openModal('jobModal')">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Post Job</span>
                </div>

                <!-- Button 2: TBD -->
                <div class="admin-card" onclick="alert('Iska feature aap batayenge!')">
                    <i class="fa-solid fa-users"></i>
                    <span>Manage Users<br><small>(TBD)</small></span>
                </div>

                <!-- Button 3: TBD -->
                <div class="admin-card" onclick="alert('Iska feature aap batayenge!')">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Payments<br><small>(TBD)</small></span>
                </div>

                <!-- Button 4: TBD -->
                <div class="admin-card" onclick="alert('Iska feature aap batayenge!')">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>Attendance<br><small>(TBD)</small></span>
                </div>

                <!-- Button 5: TBD -->
                <div class="admin-card" onclick="alert('Iska feature aap batayenge!')">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings<br><small>(TBD)</small></span>
                </div>
            </div>
        </div>
    </div>

    <!-- POST JOB MODAL -->
    <div class="modal" id="jobModal">
        <div class="modal-content">
            <h3>Post a New Job</h3>
            <input type="text" id="j-title" class="input" placeholder="Job Title (e.g. Job 3 Posted by AD)">
            <textarea id="j-desc" class="input" placeholder="Job Description..."></textarea>
            <input type="text" id="j-poster" class="input" placeholder="Cloudinary Poster URL">
            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeModal('jobModal')">Cancel</button>
                <button class="btn btn-submit" onclick="postJob()">Post Job</button>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = '/login.html';
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function postJob() {
            const title = document.getElementById('j-title').value;
            const description = document.getElementById('j-desc').value;
            const posterUrl = document.getElementById('j-poster').value;

            if(!title) return alert('Title is required!');

            try {
                const res = await fetch('/v1/jobs/admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, posterUrl })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) {
                    closeModal('jobModal');
                    // Clear inputs
                    document.getElementById('j-title').value = '';
                    document.getElementById('j-desc').value = '';
                    document.getElementById('j-poster').value = '';
                }
            } catch (err) {
                console.error(err);
                alert('Error posting job');
            }
        }
    </script>
</body>
</html>
