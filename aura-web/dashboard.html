<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aura</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f9f0e4;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            position: relative;
            background-color: #f9f0e4;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: absolute;
            top: 0;
            left: -250px;
            width: 200px;
            height: 100%;
            background-color: #fff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            transition: left 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-sidebar {
            cursor: pointer;
            font-size: 24px;
        }
        .sidebar-logout {
            margin-top: 20px;
            padding: 12px;
            background: #E47254;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.open { display: block; }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            padding-bottom: 80px; /* space for navbar */
        }
        .tab-content.active {
            display: block;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eaeaea;
        }
        .profile-icon {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #000; background: #ddd;
        }
        .header-title { text-align: center; }
        .header-title h2 { margin: 0; font-size: 20px; font-weight: 800; color: #000; }
        .header-title p { margin: 2px 0 0; font-size: 12px; color: #666; }

        /* Logout */
        .logout-btn {
            margin: 20px; padding: 6px 12px; border: 1px solid #000; border-radius: 8px; background: transparent; font-weight: bold; cursor: pointer;
        }

        /* Generic Header for other tabs */
        .generic-header {
            padding: 20px;
            border-bottom: 1px solid #000;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Cards */
        .card {
            background: #fff;
            border: 2px dashed #000;
            border-radius: 16px;
            padding: 24px;
            margin: 0 20px 16px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .solid-card {
            background: #fff;
            border: 2px solid #000;
            border-radius: 16px;
            margin: 0 20px 16px;
        }
        .row { display: flex; border-bottom: 1px solid #000; padding: 12px; }
        .row:last-child { border-bottom: none; }
        .label { font-weight: bold; width: 120px; }
        .val { flex: 1; color: #333; }

        .attendance-card {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; border: 2px solid #000; border-radius: 30px; padding: 16px 20px; margin: 0 20px 16px;
        }
        .status-circle {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        /* Scanner */
        .scanner-box { width: 250px; height: 250px; border: 2px solid #000; background: #000; margin: 40px auto; }
        .scan-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .light-btn { width: 40px; height: 60px; border: 2px solid #000; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; }
        .light-inner { width: 30px; height: 30px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .scan-btn { border: 2px solid #000; padding: 12px 40px; background: transparent; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* Profile */
        .profile-container { padding: 0 20px; }
        .prof-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .verify-btn { border: 1px solid #000; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: bold; background: transparent; }
        .prof-photo { width: 80px; height: 80px; border: 2px solid #000; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        .p-input { width: 80%; margin: 0 auto 16px; display: block; border: 1px solid #000; padding: 8px 16px; text-align: center; box-sizing: border-box; background: #fff;}
        .p-row { display: flex; width: 80%; margin: 0 auto 16px; align-items: center; gap: 10px; }
        .p-row .p-input { width: 100%; margin: 0; }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute;
            bottom: 0; width: 100%;
            background: #fff;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: #666; cursor: pointer;
        }
        .nav-item.active { color: #E47254; font-weight: bold; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; }

        #videoElement { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar -->
        <div class="overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                Menu
                <span class="close-sidebar" onclick="toggleSidebar()">&times;</span>
            </div>
            <button class="sidebar-logout" style="background:#dc3545; margin-bottom:10px;" onclick="openResignUserModal()">Leave Company</button>
            <button class="sidebar-logout" style="margin-top:0;" onclick="logout()">Log out</button>
        </div>

        <!-- 1. Home Tab -->
        <div id="tab-home" class="tab-content active">
            <div class="top-header">
                <div class="profile-icon" onclick="toggleSidebar()" style="cursor: pointer;"></div>
                <div class="header-title">
                    <h2>My Desk</h2>
                    <p>Welcome back!</p>
                </div>
                <i class="fa-regular fa-bell" style="font-size: 24px;"></i>
            </div>
            <div id="admin-jobs" style="margin-top: 20px;">Loading...</div>
        </div>

        <!-- 2. Adoc Tab -->
        <div id="tab-adoc" class="tab-content">
            <div class="generic-header">All Payments [A]</div>
            <div id="adoc-data">Loading...</div>
        </div>

        <!-- 3. Scanner Tab -->
        <div id="tab-scanner" class="tab-content">
            <div class="generic-header">Scan</div>
            <div class="scanner-box">
                <video id="videoElement" autoplay playsinline></video>
            </div>
            <div class="scan-controls">
                <button class="light-btn" onclick="toggleLight()">
                    <div class="light-inner" id="lightState">Off</div>
                </button>
                <span style="font-size: 14px; margin-right: 20px;">light<br>Button</span>
                <button class="scan-btn">Scan</button>
            </div>
        </div>

        <!-- 4. My Job Tab -->
        <div id="tab-job" class="tab-content">
            <div class="generic-header" id="company-name">Loading...</div>
            <div id="attendance-data">Loading...</div>
        </div>

        <!-- 5. Profile Tab -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-container">
                <div class="prof-header">
                    <h2>Profile</h2>
                    <button class="verify-btn">Verify btn</button>
                </div>
                <div style="border-bottom: 1px solid #000;"></div>
                
                <div class="prof-photo">Photo</div>
                
                <div id="profile-fields">Loading...</div>
            </div>
        </div>

        <!-- Bottom Navbar -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i><span>Home</span></div>
            <div class="nav-item" onclick="switchTab('adoc', this)"><i class="fa-solid fa-file-invoice"></i><span>Adoc</span></div>
            <div class="nav-item" onclick="switchTab('scanner', this)"><i class="fa-solid fa-qrcode"></i><span>Scanner</span></div>
            <div class="nav-item" onclick="switchTab('job', this)"><i class="fa-solid fa-briefcase"></i><span>My Job</span></div>
            <div class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i><span>Profile</span></div>
        </div>

        <!-- 6. Application Modal -->
        <div class="overlay" id="app-modal-overlay"></div>
        <div class="modal" id="app-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border:2px solid #000; border-radius:16px; z-index:2000; width:90%; max-width:350px;">
            <h3>Apply for Job</h3>
            <p id="app-job-title" style="margin-top:0; color:#666;"></p>
            <input type="text" id="a-name" class="p-input" placeholder="Full Name" style="width:100%; margin-bottom:10px;">
            <input type="text" id="a-phone" class="p-input" placeholder="Phone Number" style="width:100%; margin-bottom:10px;">
            <input type="text" id="a-exp" class="p-input" placeholder="Experience (e.g. 2 years)" style="width:100%; margin-bottom:10px;">
            <textarea id="a-address" class="p-input" placeholder="Full Address" style="width:100%; height:60px; margin-bottom:10px; resize:none;"></textarea>
            
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <button onclick="closeAppModal()" style="padding:10px; background:#ccc; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="submitApplication()" style="padding:10px; background:#000; color:#fff; border:none; border-radius:8px; cursor:pointer;">Submit</button>
            </div>
        </div>

        <!-- 7. Resign Modal -->
        <div class="overlay" id="resign-modal-overlay"></div>
        <div class="modal" id="resign-user-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border:2px solid #000; border-radius:16px; z-index:2000; width:90%; max-width:350px;">
            <h3>Leave Company</h3>
            <p style="color:#666; font-size:14px;">Why do you want to leave your current job?</p>
            <textarea id="r-reason" class="p-input" placeholder="Enter your reason here..." style="width:100%; height:80px; margin-bottom:10px; resize:none;"></textarea>
            
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <button onclick="closeResignUserModal()" style="padding:10px; background:#ccc; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="submitResignation()" style="padding:10px; background:#dc3545; color:#fff; border:none; border-radius:8px; cursor:pointer;">Submit Resignation</button>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = '/v1';
        let stream = null;
        let track = null;
        let flashOn = false;
        let currentUser = null;
        let selectedJobId = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function logout() {
            localStorage.removeItem('userEmail');
            window.location.href = '/login.html';
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');

            if(tabId === 'scanner') startCamera();
            else stopCamera();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('videoElement').srcObject = stream;
                track = stream.getVideoTracks()[0];
            } catch(e) { console.error("Camera err", e); }
        }

        function stopCamera() {
            if(stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null; track = null; flashOn = false;
                document.getElementById('lightState').innerText = 'Off';
            }
        }

        async function toggleLight() {
            if(!track) return;
            const capabilities = track.getCapabilities();
            if(capabilities.torch) {
                flashOn = !flashOn;
                await track.applyConstraints({ advanced: [{ torch: flashOn }] });
                document.getElementById('lightState').innerText = flashOn ? 'On' : 'Off';
            } else alert("Flashlight not supported.");
        }

        function closeAppModal() {
            document.getElementById('app-modal').style.display = 'none';
            document.getElementById('app-modal-overlay').style.display = 'none';
        }

        function applyForJob(id, title) {
            if (currentUser.permanentCompany) {
                return alert('You are already joined. Join now adoc are preference.');
            }
            if (currentUser.joinStatus === 'pending') {
                return alert('Your application is already pending. Joining on the way!');
            }
            selectedJobId = id;
            document.getElementById('app-job-title').innerText = title;
            document.getElementById('app-modal').style.display = 'block';
            document.getElementById('app-modal-overlay').style.display = 'block';
        }

        async function submitApplication() {
            const email = localStorage.getItem('userEmail');
            const name = document.getElementById('a-name').value;
            const phone = document.getElementById('a-phone').value;
            const exp = document.getElementById('a-exp').value;
            const address = document.getElementById('a-address').value;

            if(!name || !phone || !exp || !address) return alert("Please fill all fields");

            try {
                const res = await fetch(API_BASE + '/jobs/apply', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userEmail: email, 
                        jobId: selectedJobId, 
                        userInfo: `Name: ${name}, Phone: ${phone}, Exp: ${exp}, Addr: ${address}` 
                    })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) {
                    closeAppModal();
                    loadData(); // reload profile to show "Joining on the way"
                }
            } catch (err) { alert('Error submitting application'); }
        }

        function openResignUserModal() {
            if (!currentUser.permanentCompany) return alert("You are not part of any company right now.");
            if (currentUser.joinStatus === 'resigning') return alert("Your resignation is already pending admin approval.");
            
            toggleSidebar(); // close sidebar
            document.getElementById('resign-user-modal').style.display = 'block';
            document.getElementById('resign-modal-overlay').style.display = 'block';
        }

        function closeResignUserModal() {
            document.getElementById('resign-user-modal').style.display = 'none';
            document.getElementById('resign-modal-overlay').style.display = 'none';
        }

        async function submitResignation() {
            const reason = document.getElementById('r-reason').value;
            if(!reason) return alert("Please enter a reason for leaving.");
            const email = localStorage.getItem('userEmail');

            try {
                const res = await fetch(API_BASE + '/jobs/resign', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userEmail: email, reason })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) {
                    closeResignUserModal();
                    loadData(); // reload to show Resignation Pending
                }
            } catch (err) { alert('Error submitting resignation'); }
        }

        async function loadData() {
            const email = localStorage.getItem('userEmail') || 'admin@aura.com'; // fallback for demo
            
            try {
                // Fetch Profile first to get current status
                const resProf = await fetch(API_BASE + '/profile/me', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const profData = await resProf.json();
                currentUser = profData.data;

                // 1. Profile Tab
                const pd = currentUser;
                let statusHtml = '';
                if (pd.joinStatus === 'resigning') statusHtml = `<h3 style="text-align:center; color:red;">Status: Resignation Pending...</h3>`;
                else if (pd.permanentCompany) statusHtml = `<h3 style="text-align:center; color:green;">Company: ${pd.permanentCompany}</h3>`;
                else if (pd.joinStatus === 'pending') statusHtml = `<h3 style="text-align:center; color:orange;">Status: Joining on the way!</h3>`;
                else statusHtml = `<h3 style="text-align:center; color:gray;">Status: Not Joined</h3>`;

                document.getElementById('profile-fields').innerHTML = `
                    ${statusHtml}
                    <input class="p-input" value="${pd.name}" placeholder="Name" readonly>
                    <div class="p-row"><input class="p-input" value="${pd.uid}" placeholder="UID" readonly> <strong>APP. UID.</strong></div>
                    <input class="p-input" value="${pd.email}" placeholder="Email" readonly>
                `;

                // 2. Home Tab (Permanent Jobs)
                const resHome = await fetch(API_BASE + '/jobs/permanent');
                const homeData = await resHome.json();
                const adminDiv = document.getElementById('admin-jobs');
                if(homeData.data.length === 0) adminDiv.innerHTML = '<p style="text-align:center; color:#666;">No jobs available right now.</p>';
                else {
                    adminDiv.innerHTML = homeData.data.map(j => `
                        <div class="card" onclick="applyForJob('${j.id}', '${j.title}')" style="cursor:pointer;">
                            ${j.title} <br><small>${j.companyName}</small>
                        </div>`).join('');
                }

                // 3. Adoc Tab
                const resAdoc = await fetch(API_BASE + '/jobs/adoc/filtered', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userEmail: email })
                });
                const adocData = await resAdoc.json();
                const adocDiv = document.getElementById('adoc-data');
                if(adocData.data.length === 0) adocDiv.innerHTML = '<p style="text-align:center; color:#666;">No Adoc jobs available.</p>';
                else {
                    adocDiv.innerHTML = adocData.data.map(i => `
                        <div class="solid-card" style="padding:15px; margin-bottom:10px;">
                            <div class="row"><div class="label">Job:</div><div class="val">${i.title}</div></div>
                            <div class="row"><div class="label">Company:</div><div class="val">${i.companyName}</div></div>
                            <p style="text-align:center; font-size:12px; color:#666;">Scan QR matching ID: ${i.id} to join</p>
                        </div>`).join('');
                }

                // 4. My Job (Adoc History & Current Job)
                document.getElementById('company-name').innerText = pd.permanentCompany || "No Permanent Company";
                const attDiv = document.getElementById('attendance-data');
                if(!pd.adocHistory || pd.adocHistory.length === 0) {
                    attDiv.innerHTML = '<p style="text-align:center; color:#666;">No adoc attendance records found.</p>';
                } else {
                    attDiv.innerHTML = pd.adocHistory.map(a => `
                        <div class="attendance-card">
                            <div>
                                <strong>${a.title}</strong> (${a.company})<br>
                                <small>${a.date} | Payment: ${a.paymentStatus}</small>
                            </div>
                            <div class="status-circle">P</div>
                        </div>`).join('');
                }

            } catch (err) {
                console.error("API Error", err);
            }
        }

        // Mock Scanner Button (Since we can't read real QR codes easily in browser without a library)
        document.querySelector('.scan-btn').addEventListener('click', async () => {
            const jobId = prompt("Mock Scanner: Enter the Adoc Job ID to join:");
            if(!jobId) return;
            const email = localStorage.getItem('userEmail');
            
            try {
                const res = await fetch(API_BASE + '/adoc/scan', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userEmail: email, jobId })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) {
                    loadData(); // refresh history
                    switchTab('job', document.querySelectorAll('.nav-item')[3]);
                }
            } catch (err) { alert('Scan failed'); }
        });

        window.onload = loadData;
    </script>
</body>
</html>
